<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오광첩</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Serif KR',serif;background:#f7f3e9;color:#1a1a1a;margin:0;padding:16px;max-width:480px;margin:auto}
.card{background:#fff;border:1px solid #e0d8c8;border-radius:12px;padding:16px;margin:12px 0}
h1{font-size:28px;margin:0 0 8px}
.balls{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ball{width:42px;height:42px;border-radius:50%;background:#1a1a1a;color:#f7f3e9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
button{background:#1a1a1a;color:#f7f3e9;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;margin:4px}
</style>
</head>
<body>
<h1>오광첩</h1>
<p>그 주 토요일 20:35 기준</p>
<div id="app"></div>
<button onclick="redraw()">무작위 다시 뽑기</button>
<script>
function fold(v){let n=Math.abs(Math.round(v))%45;return n||45}
function slip(seeds){const u=new Set(),b=[];for(const s of seeds){if(b.length>=6)break;let n=fold(s),h=0;while(u.has(n)&&h<44){n=n===45?7:fold(n+7);h++}u.add(n);b.push(n)}return b.sort((a,b)=>a-b)}
function render(){const slips=[{t:'달',n:slip([9,11,18,32,39,45])},{t:'우주',n:slip([9,11,17,19,30,35])},{t:'태양',n:slip([2,6,7,13,14,24])},{t:'달력',n:slip([1,17,20,21,37,42])},{t:'무작위',n:[]}];document.getElementById('app').innerHTML=slips.map(s=>`<div class="card"><h3>${s.t}</h3><div class="balls">${s.n.map(n=>`<div class="ball">${n}</div>`).join('')}</div></div>`).join('')}
function redraw(){render()}
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
